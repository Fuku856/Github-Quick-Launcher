body:
  - type: input
    attributes:
      name: username
      label: "GitHub ユーザー名:"
      defaultValue: ""
      description: >
        GitHub のユーザー名です。設定すると「/」で公開リポジトリ、「*」で公開スターを一覧できます。トークンを設定する場合は不要です。
  - type: passwordBox
    attributes:
      name: token
      label: "Personal access token:"
      defaultValue: ""
      description: >
        任意。プライベート・組織のリポジトリも一覧でき、GitHub API の利用上限も上がります。有効期限付きの Fine-grained トークン（Metadata の読み取りのみ）がおすすめです。Classic トークンならスコープ不要、組織のリポジトリを含めるには read:org を許可してください。トークンは Flow Launcher の設定フォルダーに暗号化されずに保存されます。
  - type: input
    attributes:
      name: cache_ttl_minutes
      label: "キャッシュの有効期間（分）:"
      defaultValue: "360"
      description: >
        リポジトリとスターの一覧を使い回す時間です。過ぎると次に使ったときにバックグラウンドで更新します。絞り込みで 1 件も見つからないときや、検索で一覧にない自分のリポジトリが見つかったときは、期限前でも更新します（1 分に 1 回まで）。
  - type: checkbox
    attributes:
      name: online_search
      label: "入力に合わせて GitHub 全体を検索する"
      defaultValue: "true"
      description: >
        オンにすると、3 文字以上の入力を GitHub の検索 API にも送信します。オフにするとキャッシュ済みの自分のリポジトリだけを検索し、入力内容は GitHub に送信されません。
  - type: checkbox
    attributes:
      name: show_avatars
      label: "オーナーのアバターを表示する"
      defaultValue: "true"
      description: >
        各結果に GitHub からオーナーのアバター（表示倍率に合わせた小さいサイズ）を読み込みます。オフにするとプラグインのアイコンを使い、画像を読み込みません。
